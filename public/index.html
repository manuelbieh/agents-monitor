<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Monitor</title>
<style>
  :root {
    --bg: #171615;
    --divider: #2c2b29;
    --track: #393836;
    --text: #e8e6e3;
    --text-muted: #8f8c88;
    --text-dim: #6b6865;
    --green: #22b77a;
    --green-scoped: #1f8a5e;
    --amber: #d9a13b;
    --red: #e0533f;
    --salmon: #f09a82;
    --raised: #23221f;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  main { position: relative; padding: 40px 30px 60px; max-width: 1720px; }

  .app-only { display: none; }
  .embedded .app-only { display: inline-flex; }
  /* The popover stops growing at its maximum height; the rest scrolls, without rubber-banding. */
  .embedded { overscroll-behavior: none; }
  .embedded main { padding: 26px 26px 18px; }
  .embedded .account-name { font-size: 19px; }
  .embedded .reset { font-size: 16px; }
  .embedded header { top: 22px; right: 26px; }
  .toggle {
    align-items: center;
    gap: 6px;
    margin-right: 6px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .toggle input { accent-color: var(--green); margin: 0; }

  /* Sits on the same line as the first section title, and above it: sections are positioned too. */
  header {
    position: absolute;
    z-index: 1;
    top: 36px;
    right: 30px;
    display: flex;
    gap: 8px;
  }

  /* Positioned so rows measure their offsets against their own section while dragging. */
  .provider { position: relative; }
  .provider + .provider { margin-top: 38px; }
  .section-title {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 22px;
    font-size: 17px;
    font-weight: 600;
  }
  .section-title .count { color: var(--text-muted); font-size: 16px; font-weight: 400; }

  button {
    font: inherit;
    font-size: 13px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--divider);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { color: var(--text); border-color: var(--track); }

  .add-form {
    display: none;
    gap: 8px;
    margin: 42px 0 26px;
    align-items: center;
  }
  .add-form.open { display: flex; }
  .add-form input, .add-form select {
    font: 14px var(--mono);
    color: var(--text);
    background: #1f1e1c;
    border: 1px solid var(--divider);
    border-radius: 6px;
    padding: 6px 10px;
    width: 320px;
  }
  .add-form select { width: auto; font-family: var(--sans); }
  .add-form input:focus, .add-form select:focus { outline: none; border-color: var(--text-dim); }
  .add-form .error { color: var(--red); font-size: 13px; }

  .row {
    position: relative;
    display: grid;
    grid-template-columns: minmax(260px, 1.4fr) repeat(var(--cols), minmax(200px, 1fr));
    column-gap: 40px;
    padding: 18px 0 17px;
    border-bottom: 1px solid var(--divider);
  }
  .row:last-child { border-bottom: none; }

  /* Sits in the left margin and reaches the content edge, so hovering across to it keeps it shown. */
  .handle {
    position: absolute;
    top: 50%;
    left: -22px;
    display: flex;
    align-items: center;
    width: 22px;
    height: 28px;
    padding-left: 4px;
    color: var(--text-muted);
    cursor: grab;
    opacity: 0;
    transform: translateY(-50%);
    transition: opacity 0.12s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  .handle svg { fill: currentColor; }
  .handle:hover { color: var(--text); }
  .row:hover .handle, .section-title:hover .handle, .dragging .handle { opacity: 1; }

  .reordering, .reordering * {
    cursor: grabbing !important;
    -webkit-user-select: none;
    user-select: none;
  }
  /* The spread shadows pad the lifted item, reaching further left to take in the handle,
     without changing its layout. */
  .dragging {
    z-index: 5;
    background: var(--raised);
    border-radius: 4px;
    box-shadow: -6px 0 0 14px var(--raised), 0 0 0 14px var(--raised), 0 16px 36px 14px rgba(0, 0, 0, 0.5);
  }
  .row.dragging { border-bottom-color: transparent; }

  .account-head {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .dot {
    position: relative;
    flex: none;
    width: 12px;
    height: 12px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--dot);
  }
  /* A larger hit area than the dot itself. */
  .dot::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; }
  .dot:hover, .dot[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--text-dim); }
  .dot:focus-visible, .swatch:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .color-menu {
    position: absolute;
    z-index: 10;
    display: flex;
    gap: 8px;
    padding: 10px;
    background: var(--raised);
    border: 1px solid var(--divider);
    border-radius: 14px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  }
  .color-menu[hidden] { display: none; }
  .swatch {
    width: 22px;
    height: 22px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: var(--dot);
    transition: transform 0.12s ease;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--text); }

  .account-name {
    font: 700 21px/1.35 var(--mono);
    letter-spacing: 0.01em;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.blocked .account-name { color: var(--text-muted); }

  /* Sits on the plan line and reads as plain text until hovered or focused. */
  .alias {
    flex: 1 1 0;
    min-width: 120px;
    margin: -2px 0;
    padding: 1px 5px;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
  }
  .alias::placeholder { color: var(--text-dim); }
  .alias:hover { border-color: var(--divider); }
  .alias:focus { outline: none; border-color: var(--text-dim); background: #1f1e1c; }

  /* Indented by the dot and its gap, so the plan line starts under the name. */
  .account-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    column-gap: 2px;
    margin-top: 8px;
    padding-left: 22px;
    font-size: 17px;
    color: var(--text-muted);
  }
  .account-meta .back-in { color: var(--red); }
  .account-meta .problem { color: var(--salmon); }

  .remove {
    position: absolute;
    right: 0;
    top: 6px;
    padding: 0 6px;
    border: none;
    font-size: 16px;
    opacity: 0;
  }
  .row:hover .remove { opacity: 1; }

  .limit { font-size: 18px; }
  .limit.scoped { opacity: 0.72; }
  .limit.dim { opacity: 0.22; }

  .limit-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--text);
  }
  .limit.scoped .limit-head .label { color: var(--text-muted); }
  .limit-head .percent { font-weight: 500; letter-spacing: 0.04em; }

  .bar {
    height: 6px;
    margin: 13px 0 12px;
    background: var(--track);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--green);
    transition: width 0.4s ease;
  }
  .limit.scoped .bar-fill { background: var(--green-scoped); }
  .bar-fill.low { background: var(--amber); }
  .bar-fill.critical, .limit.scoped .bar-fill.critical { background: var(--red); }
  .limit.dim .bar-fill { background: #77746f; }

  .reset { color: var(--text-muted); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reset .relative { color: var(--text); }
  .reset .relative.soon { color: var(--salmon); }
  .limit.scoped .reset .relative { color: var(--text-muted); }

  .empty { color: var(--text-muted); padding: 20px 0; }
  .placeholder { color: var(--text-dim); font-size: 17px; align-self: center; }

  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<main>
  <header>
    <label class="app-only toggle"><input type="checkbox" id="launch-at-login"> Launch at login</label>
    <button id="refresh-button" type="button">Refresh</button>
    <button id="add-button" type="button">+ Add account</button>
    <button class="app-only" id="quit-button" type="button">Quit</button>
  </header>

  <form class="add-form" id="add-form">
    <select id="provider">
      <option value="claude">Claude</option>
      <option value="codex">Codex</option>
      <option value="grok">Grok</option>
    </select>
    <input id="config-dir" list="candidates" placeholder="~/.claude-other" autocomplete="off" spellcheck="false">
    <datalist id="candidates"></datalist>
    <button type="submit">Add</button>
    <button type="button" id="cancel-add">Cancel</button>
    <span class="error" id="add-error"></span>
  </form>

  <div id="accounts"></div>
  <footer id="footer"></footer>
  <div class="color-menu" id="color-menu" role="menu" aria-label="Account color" hidden></div>
</main>

<script>
  const mainEl = document.querySelector('main');
  const accountsEl = document.getElementById('accounts');
  const footerEl = document.getElementById('footer');
  const colorMenu = document.getElementById('color-menu');
  const addForm = document.getElementById('add-form');
  const addInput = document.getElementById('config-dir');
  const providerSelect = document.getElementById('provider');
  const addError = document.getElementById('add-error');

  const MINUTE = 60 * 1000;
  const HOUR = 60 * MINUTE;
  const DAY = 24 * HOUR;
  const COLUMN_ORDER = { weekly_all: 0, session: 1, weekly_scoped: 2 };
  const PROVIDERS = [
    { id: 'claude', name: 'Claude' },
    { id: 'codex', name: 'Codex' },
    { id: 'grok', name: 'Grok' },
  ];
  // Claude Code's /color palette (default theme). Accounts without a color get the grey dot.
  const COLORS = {
    red: 'rgb(220, 38, 38)',
    blue: 'rgb(106, 155, 204)',
    green: 'rgb(22, 163, 74)',
    yellow: 'rgb(202, 138, 4)',
    purple: 'rgb(130, 125, 189)',
    orange: 'rgb(217, 119, 87)',
    pink: 'rgb(196, 102, 134)',
    cyan: 'rgb(8, 145, 178)',
    default: '#77746f',
  };
  const HANDLE = `
    <span class="handle" title="Drag to reorder">
      <svg width="8" height="14" viewBox="0 0 8 14" aria-hidden="true">
        <circle cx="2" cy="2" r="1.4"/><circle cx="6" cy="2" r="1.4"/>
        <circle cx="2" cy="7" r="1.4"/><circle cx="6" cy="7" r="1.4"/>
        <circle cx="2" cy="12" r="1.4"/><circle cx="6" cy="12" r="1.4"/>
      </svg>
    </span>`;

  const embedded = new URLSearchParams(location.search).has('embedded') && Boolean(window.webkit?.messageHandlers?.resize);
  let data = { accounts: [] };
  // Chromium fires focusout on a focused field that a re-render removes.
  let rendering = false;
  // The account whose dot opened the color menu.
  let colorTarget = null;
  // The row or section being dragged, from pointerdown until it has settled after the drop.
  let drag = null;

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const pad = (n) => String(n).padStart(2, '0');

  function formatDate(ts) {
    const d = new Date(Math.round(ts / MINUTE) * MINUTE);
    const weekday = d.toLocaleDateString('en-US', { weekday: 'short' });
    return `${weekday} ${pad(d.getDate())}.${pad(d.getMonth() + 1)}. ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Never round to the largest unit: 70.5 hours must read "2d 22h", not "2 days".
  function formatRelative(ms) {
    if (ms < MINUTE) return 'in less than a minute';
    return `in ${formatCompact(ms)}`;
  }

  function formatCompact(ms) {
    const days = Math.floor(ms / DAY);
    const hours = Math.floor((ms % DAY) / HOUR);
    const minutes = Math.floor((ms % HOUR) / MINUTE);
    if (days > 0) return `${days}d ${hours}h`;
    if (hours > 0) return `${hours}h ${minutes}m`;
    return `${Math.max(minutes, 1)}m`;
  }

  function formatAge(ms) {
    if (ms < MINUTE) return 'just now';
    if (ms < HOUR) return `${Math.floor(ms / MINUTE)}m ago`;
    return `${Math.floor(ms / HOUR)}h ago`;
  }

  function planLabel(account) {
    const plan = account.plan;
    if (!plan) return PROVIDERS.find((p) => p.id === (account.provider ?? 'claude'))?.name ?? '';
    return plan.charAt(0).toUpperCase() + plan.slice(1);
  }

  function sortLimits(limits) {
    return [...limits].sort((a, b) => (COLUMN_ORDER[a.kind] ?? 3) - (COLUMN_ORDER[b.kind] ?? 3));
  }

  function isExhausted(limit, now) {
    return limit.usedPercent >= 100 && limit.resetsAt && Date.parse(limit.resetsAt) > now;
  }

  function renderLimit(limit, { now, blocked }) {
    const remaining = Math.max(0, Math.min(100, Math.round(100 - limit.usedPercent)));
    const exhausted = isExhausted(limit, now);
    const classes = ['limit'];
    if (limit.kind === 'weekly_scoped') classes.push('scoped');
    if (blocked && !exhausted) classes.push('dim');

    const fillClass = remaining <= 25 ? 'critical' : remaining <= 50 ? 'low' : '';

    let reset = '<span>No reset pending</span>';
    if (limit.resetsAt) {
      const resetTs = Date.parse(limit.resetsAt);
      const untilReset = Math.max(0, resetTs - now);
      const soon = untilReset < HOUR ? ' soon' : '';
      reset = `<span class="relative${soon}">${formatRelative(untilReset)}</span> · ${formatDate(resetTs)}`;
    }

    return `
      <div class="${classes.join(' ')}">
        <div class="limit-head">
          <span class="label">${escapeHtml(limit.label)}</span>
          <span class="percent">${remaining}%</span>
        </div>
        <div class="bar"><div class="bar-fill ${fillClass}" style="width:${remaining}%"></div></div>
        <div class="reset">${reset}</div>
      </div>`;
  }

  function renderAccount(account, now, columnCount) {
    const limits = account.limits ? sortLimits(account.limits) : [];
    const exhausted = limits.filter((l) => isExhausted(l, now));
    const blocked = exhausted.length > 0;
    // You're only back once every exhausted limit has reset.
    const backAt = blocked ? Math.max(...exhausted.map((l) => Date.parse(l.resetsAt))) : null;

    const meta = [escapeHtml(planLabel(account))];
    if (blocked) meta.push(`<span class="back-in">back in ${formatCompact(backAt - now)}</span>`);
    if (account.error) {
      const stale = account.fetchedAt ? ` · data from ${formatAge(now - account.fetchedAt)}` : '';
      meta.push(`<span class="problem">${escapeHtml(account.error)}${stale}</span>`);
    }

    let columns;
    if (limits.length > 0) {
      columns = limits.map((l) => renderLimit(l, { now, blocked })).join('');
    } else {
      const text = account.loading || !account.error ? 'Loading…' : 'No usage data yet';
      columns = `<div class="placeholder" style="grid-column: span ${columnCount}">${text}</div>`;
    }

    const name = account.email ?? account.configDir;
    const color = Object.hasOwn(COLORS, account.color ?? '') ? account.color : 'default';
    return `
      <div class="row${blocked ? ' blocked' : ''}" data-config-dir="${escapeHtml(account.configDir)}">
        <div>
          <div class="account-head">
            ${HANDLE}
            <button class="dot" type="button" style="--dot:${COLORS[color]}" data-config-dir="${escapeHtml(account.configDir)}"
              aria-haspopup="menu" aria-expanded="${colorTarget === account.configDir}"
              aria-label="Color for ${escapeHtml(name)}: ${color}" title="Change color"></button>
            <div class="account-name" title="${escapeHtml(account.configDir)}">${escapeHtml(name)}</div>
          </div>
          <div class="account-meta">
            <span>${meta.join(' · ')} ·</span>
            <input class="alias" type="text" value="${escapeHtml(account.alias ?? '')}" placeholder="Add alias"
              maxlength="80" autocomplete="off" spellcheck="false" aria-label="Alias for ${escapeHtml(name)}"
              data-config-dir="${escapeHtml(account.configDir)}">
          </div>
        </div>
        ${columns}
        <button class="remove" type="button" title="Remove account" data-config-dir="${escapeHtml(account.configDir)}">×</button>
      </div>`;
  }

  function renderSection(provider, accounts, now) {
    const columnCount = Math.max(3, ...accounts.map((a) => a.limits?.length ?? 0));
    return `
      <section class="provider" style="--cols:${columnCount}">
        <h2 class="section-title">${HANDLE}${escapeHtml(provider.name)} <span class="count">${accounts.length}</span></h2>
        ${accounts.map((a) => renderAccount(a, now, columnCount)).join('')}
      </section>`;
  }

  function render() {
    // A re-render would drop the item being dragged. The drop renders afterwards.
    if (drag?.active) return;
    const now = Date.now();
    const { accounts } = data;

    if (accounts.length === 0) {
      accountsEl.innerHTML = '<div class="empty">No accounts yet. Add a Claude, Codex, or Grok config directory to start monitoring.</div>';
      footerEl.textContent = '';
      return;
    }

    // The periodic refresh re-renders everything; keep an alias that is being typed, or a focused dot.
    const focused = accountsEl.contains(document.activeElement) && document.activeElement.matches('.alias, .dot')
      ? document.activeElement
      : null;

    // Sections follow the order of their first account, so one saved list orders both.
    const providerIds = [...new Set(accounts.map((a) => a.provider ?? 'claude'))];
    rendering = true;
    accountsEl.innerHTML = providerIds.map((id) => {
      const provider = PROVIDERS.find((p) => p.id === id) ?? { id, name: id };
      return renderSection(provider, accounts.filter((a) => (a.provider ?? 'claude') === id), now);
    }).join('');
    rendering = false;

    if (focused) {
      const selector = focused.classList.contains('alias') ? '.alias' : '.dot';
      const match = [...accountsEl.querySelectorAll(selector)].find((el) => el.dataset.configDir === focused.dataset.configDir);
      if (match && selector === '.alias') {
        match.value = focused.value;
        match.focus();
        match.setSelectionRange(focused.selectionStart, focused.selectionEnd);
      } else {
        match?.focus();
      }
    }

    const fetched = accounts.map((a) => a.fetchedAt).filter(Boolean);
    footerEl.textContent = fetched.length
      ? `Updated ${formatAge(now - Math.min(...fetched))} · refreshes every 5 minutes`
      : '';
  }

  async function load() {
    try {
      const res = await fetch('/api/state');
      data = await res.json();
      render();
    } catch {
      footerEl.textContent = 'Monitor server is not reachable';
    }
  }

  async function loadCandidates() {
    addInput.placeholder = `~/.${providerSelect.value}-other`;
    const res = await fetch(`/api/candidates?provider=${providerSelect.value}`);
    const { candidates } = await res.json();
    document.getElementById('candidates').innerHTML = candidates
      .map((c) => `<option value="${escapeHtml(c)}"></option>`)
      .join('');
  }

  document.getElementById('add-button').addEventListener('click', () => {
    addForm.classList.add('open');
    addError.textContent = '';
    loadCandidates();
    addInput.focus();
  });

  providerSelect.addEventListener('change', loadCandidates);

  document.getElementById('cancel-add').addEventListener('click', () => {
    addForm.classList.remove('open');
    addInput.value = '';
  });

  addForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    addError.textContent = '';
    // Passed as a query parameter: WebKit drops request bodies on custom URL schemes.
    const res = await fetch(
      `/api/accounts?provider=${providerSelect.value}&configDir=${encodeURIComponent(addInput.value)}`,
      { method: 'POST' },
    );
    const body = await res.json();
    if (!res.ok) {
      addError.textContent = body.error;
      return;
    }
    data = body;
    addInput.value = '';
    addForm.classList.remove('open');
    render();
  });

  accountsEl.addEventListener('click', async (event) => {
    const button = event.target.closest('.remove');
    if (!button) return;
    const { configDir } = button.dataset;
    if (!confirm(`Stop monitoring ${configDir}?`)) return;
    const res = await fetch(`/api/accounts?configDir=${encodeURIComponent(configDir)}`, { method: 'DELETE' });
    if (res.ok) {
      data = await res.json();
      render();
    }
  });

  // Saves when the field loses focus, which includes the popover closing.
  accountsEl.addEventListener('focusout', async (event) => {
    const input = event.target.closest('.alias');
    if (!input || rendering) return;
    const { configDir } = input.dataset;
    const alias = input.value.trim();
    const account = data.accounts.find((a) => a.configDir === configDir);
    if (!account || (account.alias ?? '') === alias) return;
    account.alias = alias;
    const res = await fetch(
      `/api/alias?configDir=${encodeURIComponent(configDir)}&alias=${encodeURIComponent(alias)}`,
      { method: 'POST' },
    );
    if (res.ok) {
      data = await res.json();
      render();
    }
  });

  accountsEl.addEventListener('keydown', (event) => {
    const input = event.target.closest('.alias');
    if (!input) return;
    if (event.key === 'Enter') input.blur();
    if (event.key === 'Escape') {
      // Cancel the edit without also closing the popover.
      event.preventDefault();
      input.value = data.accounts.find((a) => a.configDir === input.dataset.configDir)?.alias ?? '';
      input.blur();
    }
  });

  // ---------- colors ----------

  colorMenu.innerHTML = Object.entries(COLORS)
    .map(([name, value]) =>
      `<button class="swatch" type="button" role="menuitemradio" data-color="${name}" style="--dot:${value}"
        title="${name}" aria-label="${name}"></button>`)
    .join('');

  const dotFor = (configDir) => [...accountsEl.querySelectorAll('.dot')].find((el) => el.dataset.configDir === configDir);

  function openColorMenu(dot) {
    closeColorMenu();
    colorTarget = dot.dataset.configDir;
    dot.setAttribute('aria-expanded', 'true');
    const current = data.accounts.find((a) => a.configDir === colorTarget)?.color ?? 'default';
    for (const swatch of colorMenu.children) swatch.setAttribute('aria-checked', String(swatch.dataset.color === current));
    colorMenu.hidden = false;

    // Below the dot, or above it when the popover has no room left underneath.
    const origin = mainEl.getBoundingClientRect();
    const anchor = dot.getBoundingClientRect();
    const fitsBelow = anchor.bottom + 12 + colorMenu.offsetHeight <= innerHeight;
    colorMenu.style.left = `${anchor.left - origin.left - 12}px`;
    colorMenu.style.top = fitsBelow
      ? `${anchor.bottom - origin.top + 12}px`
      : `${anchor.top - origin.top - 12 - colorMenu.offsetHeight}px`;
    colorMenu.querySelector('[aria-checked="true"]').focus();
  }

  function closeColorMenu({ focusDot = false } = {}) {
    if (colorMenu.hidden) return;
    colorMenu.hidden = true;
    const dot = dotFor(colorTarget);
    colorTarget = null;
    dot?.setAttribute('aria-expanded', 'false');
    if (focusDot) dot?.focus();
  }

  async function setColor(configDir, color) {
    const account = data.accounts.find((a) => a.configDir === configDir);
    if (!account) return;
    account.color = color === 'default' ? null : color;
    render();
    const res = await fetch(`/api/color?configDir=${encodeURIComponent(configDir)}&color=${color}`, { method: 'POST' });
    if (res.ok) {
      data = await res.json();
      render();
    }
  }

  accountsEl.addEventListener('click', (event) => {
    const dot = event.target.closest('.dot');
    if (!dot) return;
    if (colorTarget === dot.dataset.configDir) closeColorMenu();
    else openColorMenu(dot);
  });

  colorMenu.addEventListener('click', (event) => {
    const swatch = event.target.closest('.swatch');
    if (!swatch) return;
    const configDir = colorTarget;
    closeColorMenu({ focusDot: true });
    setColor(configDir, swatch.dataset.color);
  });

  colorMenu.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      // Close the menu without also closing the popover.
      event.preventDefault();
      closeColorMenu({ focusDot: true });
      return;
    }
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
    if (!step) return;
    event.preventDefault();
    const swatches = [...colorMenu.children];
    const index = swatches.indexOf(document.activeElement);
    swatches[(index + step + swatches.length) % swatches.length].focus();
  });

  document.addEventListener('pointerdown', (event) => {
    if (!event.target.closest('.color-menu, .dot')) closeColorMenu();
  });
  window.addEventListener('blur', () => closeColorMenu());

  // ---------- reordering ----------

  // A row's handle moves it within its own section, a section title's handle moves the whole section.
  accountsEl.addEventListener('pointerdown', (event) => {
    const handle = event.target.closest('.handle');
    if (event.button !== 0 || drag || !handle) return;
    const item = handle.closest('.row') ?? handle.closest('.provider');
    drag = { item, startY: event.clientY, clientY: event.clientY, active: false };
  });

  window.addEventListener('pointermove', (event) => {
    if (!drag || drag.dropping) return;
    drag.clientY = event.clientY;
    if (!drag.active) {
      // Short movements stay clicks.
      if (Math.abs(drag.clientY - drag.startY) < 4) return;
      startDrag();
    }
    followPointer();
  });

  window.addEventListener('pointerup', () => {
    if (drag?.active && !drag.dropping) drop();
    else if (!drag?.dropping) drag = null;
  });

  window.addEventListener('pointercancel', () => {
    if (drag?.active && !drag.dropping) cancelDrag();
    else if (!drag?.dropping) drag = null;
  });

  window.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || !drag?.active || drag.dropping) return;
    // Cancel the drag without also closing the popover.
    event.preventDefault();
    cancelDrag();
  });

  // Wheel scrolling and edge scrolling move the content under a pointer that stays put.
  window.addEventListener('scroll', () => {
    if (drag?.active && !drag.dropping) followPointer();
  });

  function startDrag() {
    drag.active = true;
    drag.grab = drag.startY - drag.item.getBoundingClientRect().top;
    closeColorMenu();
    document.activeElement?.blur();
    getSelection().removeAllRanges();
    document.documentElement.classList.add('reordering');
    drag.item.classList.add('dragging');
    requestAnimationFrame(scrollAtEdges);
  }

  const kindOf = (item) => (item.classList.contains('row') ? '.row' : '.provider');

  function followPointer() {
    const { item } = drag;
    const kind = kindOf(item);
    // Offsets are layout positions, so sibling animations don't disturb the hit testing.
    const y = drag.clientY - item.offsetParent.getBoundingClientRect().top;
    const siblings = [...item.parentElement.children].filter((el) => el !== item && el.matches(kind));
    if (siblings.length === 0) return;

    const next = siblings.find((el) => y < el.offsetTop + el.offsetHeight / 2);
    const target = next ? siblings.indexOf(next) : siblings.length;
    const current = [...item.parentElement.children].filter((el) => el.matches(kind)).indexOf(item);
    if (target !== current) {
      const before = siblings.map((el) => el.offsetTop);
      if (next) next.before(item);
      else siblings.at(-1).after(item);
      siblings.forEach((el, i) => {
        const shift = before[i] - el.offsetTop;
        if (shift) el.animate([{ transform: `translateY(${shift}px)` }, { transform: 'none' }], { duration: 160, easing: 'ease-out' });
      });
    }

    // Follow the pointer, but stay within the group.
    const group = [...item.parentElement.children].filter((el) => el.matches(kind));
    const last = group.at(-1);
    const top = Math.max(group[0].offsetTop, Math.min(last.offsetTop + last.offsetHeight - item.offsetHeight, y - drag.grab));
    item.style.transform = `translateY(${top - item.offsetTop}px)`;
  }

  function scrollAtEdges() {
    if (!drag?.active || drag.dropping) return;
    const edge = 60;
    const { clientY } = drag;
    const distance = clientY < edge ? clientY - edge : clientY > innerHeight - edge ? clientY - (innerHeight - edge) : 0;
    if (distance) scrollBy(0, distance / 4);
    requestAnimationFrame(scrollAtEdges);
  }

  function endDrag() {
    document.documentElement.classList.remove('reordering');
    drag.item.classList.remove('dragging');
    drag.item.style.transform = '';
    drag = null;
  }

  function cancelDrag() {
    endDrag();
    // The data still holds the old order.
    render();
  }

  async function drop() {
    drag.dropping = true;
    const { item } = drag;
    const offset = item.style.transform;
    item.style.transform = '';
    const settled = item.animate([{ transform: offset }, { transform: 'none' }], { duration: 150, easing: 'ease-out' })
      .finished.catch(() => {});

    const order = [...accountsEl.querySelectorAll('.row')].map((row) => row.dataset.configDir);
    const unchanged = order.join('\n') === data.accounts.map((a) => a.configDir).join('\n');
    if (!unchanged) {
      const byDir = new Map(data.accounts.map((a) => [a.configDir, a]));
      data.accounts = [
        ...order.map((dir) => byDir.get(dir)).filter(Boolean),
        ...data.accounts.filter((a) => !order.includes(a.configDir)),
      ];
    }
    const saved = unchanged
      ? null
      : fetch(`/api/order?${order.map((dir) => `configDir=${encodeURIComponent(dir)}`).join('&')}`, { method: 'POST' })
        .catch(() => null);

    await settled;
    endDrag();
    const res = await saved;
    if (res?.ok) data = await res.json();
    render();
  }

  document.getElementById('refresh-button').addEventListener('click', async () => {
    await fetch('/api/refresh', { method: 'POST' });
    setTimeout(load, 1500);
  });

  // Inside the menu bar app: report content height so the popover can size itself,
  // and show the app-only controls.
  if (embedded) {
    document.documentElement.classList.add('embedded');
    const reportHeight = () =>
      window.webkit.messageHandlers.resize.postMessage(Math.ceil(document.querySelector('main').getBoundingClientRect().height));
    new ResizeObserver(reportHeight).observe(document.querySelector('main'));

    const launchToggle = document.getElementById('launch-at-login');
    fetch('/api/app').then((res) => res.json()).then(({ launchAtLogin }) => {
      launchToggle.checked = launchAtLogin;
    });
    launchToggle.addEventListener('change', async () => {
      const res = await fetch(`/api/launch-at-login?enabled=${launchToggle.checked ? 1 : 0}`, { method: 'POST' });
      const body = await res.json();
      if (!res.ok) alert(body.error);
      launchToggle.checked = Boolean(body.launchAtLogin);
    });
    document.getElementById('quit-button').addEventListener('click', () => fetch('/api/quit', { method: 'POST' }));
  }

  load();
  setInterval(load, 15 * 1000);
</script>
</body>
</html>
